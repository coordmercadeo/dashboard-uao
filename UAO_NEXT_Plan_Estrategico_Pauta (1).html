<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAO NEXT · Plan de Lanzamiento y Pauta — $150M COP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;0,900;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --rojo:#E2231A;
  --rojo-oscuro:#A8151E;
  --rojo-suave:#F6BDB6;
  --crema:#FBF3E6;
  --crema2:#F3E7D4;
  --crema3:#EFDCC0;
  --tinto:#3B1418;
  --texto:#2B2018;
  --texto-suave:#6b5c4f;
  --verde:#2E7D5B;
  --verde-suave:#DCEBE2;
  --amarillo:#C98A1E;
  --amarillo-suave:#F7E5C2;
  --naranja:#C0521F;
  --gris:#8a7d70;
  --blanco:#FFFFFF;
  --borde:#E7D9C4;
  --sombra: 0 14px 34px rgba(59,20,24,.12);
  --sombra-lg: 0 24px 60px rgba(59,20,24,.20);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'DM Sans', -apple-system, Segoe UI, sans-serif;
  background:var(--crema);
  color:var(--texto);
  overflow:hidden;
  height:100vh;
  width:100vw;
}
h1,h2,h3,.serif{font-family:'DM Serif Display', Georgia, serif; font-weight:400;}
.eyebrow{
  text-transform:uppercase; letter-spacing:.14em; font-size:11.5px; font-weight:700;
  color:var(--rojo); margin:0 0 10px 0; display:flex; align-items:center; gap:8px;
}
.eyebrow .ico{width:15px;height:15px;flex-shrink:0;}
.mono-tag{
  display:inline-flex; align-items:center; gap:8px; background:var(--tinto); color:var(--crema); font-size:11px;
  letter-spacing:.08em; text-transform:uppercase; padding:6px 14px; border-radius:20px; font-weight:700;
}
.mono-tag.on-red{background:var(--rojo);}

/* ---------- APP SHELL ---------- */
#app{position:relative; height:100vh; width:100vw;}

.topbar{
  position:fixed; top:0; left:0; right:0; height:56px; z-index:500;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px; background:linear-gradient(180deg, rgba(251,243,230,.98), rgba(251,243,230,.85));
  border-bottom:1px solid var(--borde);
  backdrop-filter:blur(6px);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .logo{
  width:34px;height:34px;border-radius:9px;background:var(--rojo);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'DM Serif Display',serif;font-size:16px;
  box-shadow:0 4px 10px rgba(226,35,26,.35);
}
.brand .name{font-weight:700; font-size:14px; letter-spacing:.02em;}
.brand .name small{display:block; font-weight:400; font-size:10.5px; color:var(--texto-suave); letter-spacing:.06em;}

.progress-wrap{flex:1; max-width:420px; margin:0 26px; display:flex; align-items:center; gap:10px;}
.progress-track{flex:1; height:5px; background:var(--crema2); border-radius:3px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--rojo), var(--amarillo)); width:3.4%; transition:width .35s ease;}
.progress-label{font-size:11px; color:var(--texto-suave); white-space:nowrap; font-variant-numeric:tabular-nums;}

.topbar-actions{display:flex; align-items:center; gap:8px;}
.btn{
  border:1px solid var(--borde); background:var(--blanco); color:var(--texto);
  padding:8px 12px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:6px; font-family:inherit;
}
.btn:hover{border-color:var(--rojo); color:var(--rojo);}
.btn.primary{background:var(--rojo); color:#fff; border-color:var(--rojo);}
.btn.primary:hover{background:var(--rojo-oscuro); color:#fff;}
.btn svg{width:14px;height:14px;}

/* ---------- MENU ---------- */
#menuOverlay{
  position:fixed; inset:0; background:rgba(43,32,24,.6); z-index:900; display:none;
  align-items:flex-start; justify-content:center; padding:80px 20px 40px;
  backdrop-filter:blur(3px);
}
#menuOverlay.open{display:flex;}
.menu-panel{
  background:var(--crema); border-radius:18px; max-width:1020px; width:100%;
  max-height:80vh; overflow-y:auto; box-shadow:var(--sombra-lg); border:1px solid var(--borde);
  padding:26px 26px 30px;
}
.menu-panel h2{margin:0 0 4px; font-size:24px;}
.menu-panel .sub{color:var(--texto-suave); font-size:13px; margin-bottom:18px;}
.menu-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:10px;}
.menu-item{
  text-align:left; border:1px solid var(--borde); background:var(--blanco); border-radius:12px;
  padding:12px 14px; cursor:pointer; font-family:inherit;
}
.menu-item:hover{border-color:var(--rojo); background:#fff7ef;}
.menu-item .num{color:var(--rojo); font-weight:700; font-size:11px; letter-spacing:.06em;}
.menu-item .ttl{font-weight:700; font-size:13px; margin-top:3px;}
.menu-item.active{border-color:var(--rojo); background:#FCEFE7;}

/* ---------- SLIDES ---------- */
.slides-wrap{position:absolute; top:56px; bottom:44px; left:0; right:0; overflow:hidden;}
.slide{
  position:absolute; inset:0; padding:34px 64px 30px; overflow-y:auto; overflow-x:hidden;
  opacity:0; visibility:hidden; transform:translateX(24px);
  transition:opacity .38s ease, transform .38s ease;
}
.slide.active{opacity:1; visibility:visible; transform:translateX(0); z-index:10;}

/* decorative accents per slide */
.bg-shape{position:absolute; border-radius:50%; z-index:0; pointer-events:none; opacity:.5;}
.slide > .bg-shape.br{right:-140px; top:-140px; width:420px; height:420px; background:radial-gradient(circle at 30% 30%, var(--rojo-suave), transparent 70%);}
.slide > .bg-shape.bl{left:-160px; bottom:-160px; width:380px; height:380px; background:radial-gradient(circle at 60% 60%, var(--amarillo-suave), transparent 70%);}
.slide > *:not(.bg-shape){position:relative; z-index:1;}

.slide-head{margin-bottom:22px;}
.slide-head h1{font-size:32px; margin:2px 0 6px; color:var(--tinto); max-width:900px;}
.slide-head .desc{color:var(--texto-suave); font-size:14.5px; max-width:760px; line-height:1.55;}

.grid{display:grid; gap:18px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}

.card{
  background:var(--blanco); border:1px solid var(--borde); border-radius:16px; padding:18px 20px;
  box-shadow:var(--sombra);
}
.card h3{font-size:15px; margin:0 0 10px; font-family:'DM Sans'; font-weight:700; color:var(--tinto); display:flex; align-items:center; gap:8px;}
.card h3 .ico{width:18px;height:18px; color:var(--rojo); flex-shrink:0;}
.card.tint{background:#FCEFE7; border-color:#F2D3B8;}
.card.tint-green{background:var(--verde-suave); border-color:#BFDCCB;}
.card.tint-amber{background:var(--amarillo-suave); border-color:#E9CB92;}
.card.dark{background:var(--tinto); color:var(--crema); border-color:var(--tinto);}
.card.dark h3{color:var(--crema);}
.card.dark h3 .ico{color:var(--rojo-suave);}

.kpi-card{background:var(--blanco); border:1px solid var(--borde); border-radius:16px; padding:16px 18px; box-shadow:var(--sombra);}
.kpi-card .kpi-val{font-family:'DM Serif Display'; font-size:30px; color:var(--rojo); line-height:1;}
.kpi-card .kpi-lbl{font-size:11.5px; color:var(--texto-suave); margin-top:6px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{
  text-align:left; background:var(--tinto); color:var(--crema); padding:9px 10px; font-weight:700;
  font-size:11px; text-transform:uppercase; letter-spacing:.03em;
}
th:first-child{border-radius:8px 0 0 0;} th:last-child{border-radius:0 8px 0 0;}
td{padding:8px 10px; border-bottom:1px solid var(--borde); vertical-align:top;}
tr:nth-child(even) td{background:#FBF6ED;}
.table-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--borde);}

.tag{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.02em;}
.tag.paid{background:#FCEFE7; color:var(--rojo-oscuro);}
.tag.owned{background:#E9F2EC; color:var(--verde);}
.tag.earned{background:#FDF3DC; color:var(--amarillo);}
.tag.green{background:#E9F2EC; color:var(--verde);}
.tag.amber{background:#FDF3DC; color:var(--amarillo);}
.tag.red{background:#FBE4E1; color:var(--rojo-oscuro);}

.pill-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.pill{background:var(--crema2); border-radius:20px; padding:5px 12px; font-size:11.5px; font-weight:700; color:var(--tinto);}

.badge-num{
  width:30px;height:30px;border-radius:50%;background:var(--rojo);color:#fff;font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center; flex-shrink:0; box-shadow:0 4px 10px rgba(226,35,26,.35);
}

footer.slide-src{margin-top:22px; font-size:10.5px; color:var(--gris); border-top:1px dashed var(--borde); padding-top:10px;}

/* ---- ASK CARDS (opening) ---- */
.ask-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.ask-card{background:var(--blanco); border-radius:18px; padding:20px 20px 18px; box-shadow:var(--sombra); border:1px solid var(--borde); position:relative;}
.ask-card .askno{font-family:'DM Serif Display'; font-size:44px; color:var(--rojo-suave); line-height:1; position:absolute; top:14px; right:18px;}
.ask-card h4{margin:0 0 8px; font-size:15.5px; color:var(--tinto); max-width:80%;}
.ask-card p{font-size:12px; color:var(--texto-suave); line-height:1.5; margin:0;}

/* ---- STAT HERO ---- */
.stat-hero{display:flex; align-items:center; gap:50px; margin-top:6px;}
.stat-hero .big{flex-shrink:0;}
.stat-hero .big .num{font-family:'DM Serif Display'; font-size:110px; color:var(--rojo); line-height:1;}
.stat-hero .big .cap{font-size:13px; color:var(--texto-suave); max-width:260px; margin-top:4px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.stat-support{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; flex:1;}

/* ---- QUOTE HERO ---- */
.quote-hero{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; height:calc(100% - 20px); max-width:920px;}
.quote-hero .qmark{font-family:'DM Serif Display'; font-size:90px; color:var(--rojo-suave); line-height:.6; margin-bottom:-10px;}
.quote-hero blockquote{font-family:'DM Serif Display'; font-size:34px; line-height:1.35; color:var(--tinto); margin:0 0 18px;}
.quote-hero .attrib{font-size:13px; color:var(--texto-suave); font-weight:700;}

/* ---- persona strip (compact) ---- */
.persona-strip{display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
.persona-chip{background:var(--blanco); border:1px solid var(--borde); border-radius:16px; padding:16px 14px; box-shadow:var(--sombra); text-align:left;}
.persona-chip .picon{width:34px;height:34px;border-radius:10px; background:var(--tinto); display:flex; align-items:center; justify-content:center; margin-bottom:10px; color:var(--crema);}
.persona-chip .page{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--rojo); font-weight:700;}
.persona-chip h4{margin:3px 0 8px; font-size:14.5px; font-family:'DM Serif Display'; color:var(--tinto);}
.persona-chip .pq{font-size:11px; font-style:italic; color:var(--texto-suave); line-height:1.4; margin-bottom:8px; min-height:44px;}
.persona-chip .pcta{font-size:10.5px; font-weight:700; color:var(--rojo-oscuro); background:#FCEFE7; padding:5px 8px; border-radius:8px; display:inline-block;}

/* ---- balance split (digital vs presencial) ---- */
.balance-wrap{display:flex; gap:0; border-radius:20px; overflow:hidden; box-shadow:var(--sombra); border:1px solid var(--borde);}
.balance-side{flex:1; padding:22px 24px; }
.balance-side.left{background:var(--tinto); color:var(--crema);}
.balance-side.right{background:var(--blanco); color:var(--texto);}
.balance-side h4{font-size:15px; margin:8px 0 10px; display:flex; align-items:center; gap:8px;}
.balance-side.left h4{color:var(--crema);}
.balance-side ul{margin:0; padding-left:18px; font-size:12.3px; line-height:1.7;}
.balance-vs{width:56px; display:flex; align-items:center; justify-content:center; background:var(--rojo); color:#fff; font-family:'DM Serif Display'; font-size:15px; flex-shrink:0;}

/* ---- Journey compact timeline ---- */
.jtrack{display:flex; align-items:flex-start; gap:0; overflow-x:auto; padding:8px 0 14px;}
.jnode{display:flex; flex-direction:column; align-items:center; min-width:96px; flex-shrink:0;}
.jnode .dot{width:38px;height:38px;border-radius:50%; background:var(--rojo); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; box-shadow:0 4px 10px rgba(226,35,26,.3); z-index:2;}
.jnode .lbl{font-size:10.5px; font-weight:700; text-align:center; margin-top:8px; color:var(--tinto); max-width:96px; line-height:1.3;}
.jline{flex:1; height:3px; background:linear-gradient(90deg, var(--rojo), var(--amarillo)); margin-top:19px; min-width:20px;}

/* ---- Fases timeline ---- */
.fase-timeline{display:flex; gap:14px;}
.fase-block{flex:1; border-radius:18px; padding:18px 18px 20px; box-shadow:var(--sombra); position:relative; overflow:hidden;}
.fase-block .fnum{position:absolute; top:10px; right:14px; font-family:'DM Serif Display'; font-size:38px; opacity:.25;}
.fase-block h4{margin:2px 0 2px; font-size:16px;}
.fase-block .fsem{font-size:10.5px; opacity:.85; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
.fase-block .fval{font-family:'DM Serif Display'; font-size:26px; margin:10px 0 2px;}
.fase-block .fpct{font-size:11px; opacity:.85; margin-bottom:10px;}
.fase-block p{font-size:11.6px; line-height:1.5; margin:0;}

/* ---- Evento hero ---- */
.evento-hero{display:grid; grid-template-columns:1.1fr .9fr; gap:22px;}
.evento-visual{background:var(--tinto); border-radius:20px; padding:26px; color:var(--crema); display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden;}
.evento-visual .ev-icon{width:52px;height:52px; border-radius:14px; background:var(--rojo); display:flex; align-items:center; justify-content:center; margin-bottom:16px;}
.evento-visual h2{font-size:28px; margin:0 0 10px; color:var(--crema);}
.evento-visual p{font-size:13px; color:#E8D9C2; line-height:1.6;}
.evento-stats{display:flex; gap:14px; margin-top:18px;}
.evento-stats .es{background:rgba(255,255,255,.08); border-radius:12px; padding:10px 14px; flex:1;}
.evento-stats .es .v{font-family:'DM Serif Display'; font-size:24px; color:#fff;}
.evento-stats .es .l{font-size:10px; color:#CBB9A0; text-transform:uppercase; letter-spacing:.04em;}

/* charts */
.chart-row{display:flex; gap:22px; align-items:center; flex-wrap:wrap;}
.legend{display:flex; flex-direction:column; gap:7px; font-size:12px;}
.legend .li{display:flex; align-items:center; gap:8px;}
.legend .sw{width:11px;height:11px;border-radius:3px; flex-shrink:0;}
.legend .lv{font-weight:700; margin-left:auto; padding-left:14px; font-variant-numeric:tabular-nums;}

.bar-chart{display:flex; flex-direction:column; gap:9px;}
.bar-row{display:grid; grid-template-columns:170px 1fr 90px; align-items:center; gap:10px; font-size:11.6px;}
.bar-track{background:var(--crema2); border-radius:6px; height:16px; overflow:hidden;}
.bar-fill{height:100%; border-radius:6px;}
.bar-val{text-align:right; font-weight:700; font-variant-numeric:tabular-nums;}

.funnel{display:flex; flex-direction:column; align-items:center; gap:4px; margin:6px 0;}
.funnel-step{color:#fff; text-align:center; padding:10px 12px; border-radius:8px; font-size:12.5px; font-weight:700;}
.funnel-step small{display:block; font-weight:400; font-size:10.5px; opacity:.9; margin-top:2px;}

.timeline-months{display:grid; grid-template-columns:repeat(6,1fr); gap:10px;}
.tmonth{background:var(--blanco); border:1px solid var(--borde); border-radius:12px; padding:10px 12px;}
.tmonth h5{margin:0 0 2px; font-size:12.5px; color:var(--rojo-oscuro);}
.tmonth .val{font-family:'DM Serif Display'; font-size:19px;}
.tmonth .fase{font-size:10px; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.04em;}
.tmonth .bar{height:6px; background:var(--crema2); border-radius:4px; margin-top:8px; overflow:hidden;}
.tmonth .bar i{display:block; height:100%; background:var(--rojo);}

.decision-list{list-style:none; margin:0; padding:0; counter-reset:dec;}
.decision-list li{counter-increment:dec; position:relative; padding:9px 0 9px 40px; border-bottom:1px solid var(--borde); font-size:12.6px;}
.decision-list li:last-child{border-bottom:none;}
.decision-list li::before{content:counter(dec); position:absolute; left:0; top:7px; width:26px; height:26px; background:var(--rojo); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;}
.decision-list b{color:var(--tinto);}

.scenario-card{border-radius:16px; padding:16px 18px; border:1px solid var(--borde); box-shadow:var(--sombra);}
.scenario-card.cons{background:#FBEEEA;}
.scenario-card.esp{background:#FDF3DC;}
.scenario-card.opt{background:#EAF3EC;}
.scenario-card h4{margin:0 0 4px; font-size:15px;}
.scenario-card .stag{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; opacity:.7; margin-bottom:8px;}
.scenario-card .row{display:flex; justify-content:space-between; font-size:12px; padding:4px 0; border-bottom:1px dashed rgba(0,0,0,.08);}
.scenario-card .row b{font-variant-numeric:tabular-nums;}
.scenario-card .hero-mat{text-align:center; margin:10px 0 12px; padding:10px; background:rgba(255,255,255,.55); border-radius:12px;}
.scenario-card .hero-mat .v{font-family:'DM Serif Display'; font-size:32px;}
.scenario-card .hero-mat .l{font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:700;}

.cover-slide{display:flex; flex-direction:column; justify-content:center; height:100%; padding-left:10px;}
.cover-slide .mono-tag{margin-bottom:18px;}
.cover-slide h1{font-size:54px; line-height:1.06; margin:0 0 14px; color:var(--tinto); max-width:820px;}
.cover-slide .lead{font-size:16.5px; color:var(--texto-suave); max-width:600px; line-height:1.6;}
.cover-slide .foot-meta{margin-top:36px; display:flex; gap:30px; font-size:11.5px; color:var(--gris);}
.cover-slide .arc{display:flex; gap:8px; margin-top:26px;}
.cover-slide .arc span{background:var(--tinto); color:var(--crema); font-size:11px; font-weight:700; padding:6px 12px; border-radius:20px;}
.cover-slide .arc span:nth-child(2){background:var(--rojo);}
.cover-slide .arc span:nth-child(3){background:var(--amarillo);}

.closing-slide{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center;}
.closing-slide h1{font-size:42px; max-width:820px; color:var(--tinto); margin-bottom:14px;}
.closing-slide .steps3{display:flex; gap:18px; margin-top:30px;}
.closing-slide .steps3 .s{background:var(--blanco); border:1px solid var(--borde); border-radius:16px; padding:16px 22px; box-shadow:var(--sombra); min-width:170px;}
.closing-slide .steps3 .s .v{font-family:'DM Serif Display'; font-size:22px; color:var(--rojo);}
.closing-slide .steps3 .s .l{font-size:11px; color:var(--texto-suave); margin-top:4px;}

.scrollbar-hide::-webkit-scrollbar{width:6px;}
.scrollbar-hide::-webkit-scrollbar-thumb{background:var(--borde); border-radius:6px;}

.bottombar{
  position:fixed; bottom:0; left:0; right:0; height:44px; z-index:500;
  display:flex; align-items:center; justify-content:space-between; padding:0 18px;
  background:rgba(251,243,230,.96); border-top:1px solid var(--borde);
}
.nav-btn{
  width:34px;height:34px;border-radius:50%; border:1px solid var(--borde); background:var(--blanco);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.nav-btn:hover{border-color:var(--rojo); background:#FCEFE7;}
.nav-btn svg{width:16px;height:16px; stroke:var(--tinto);}
.nav-center{font-size:11.5px; color:var(--texto-suave); text-align:center;}
.dots{display:flex; gap:4px; flex-wrap:wrap; max-width:460px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--borde); cursor:pointer;}
.dot.active{background:var(--rojo); width:16px; border-radius:3px;}

@media (max-width:1100px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-5{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .persona-strip{grid-template-columns:repeat(2,1fr);}
  .ask-grid{grid-template-columns:1fr;}

/* =========================================================================
   RENDER HELPERS — SVG donut & bar charts
   ========================================================================= */
function donutSVG(data, size=180, thickness=30){
  const total = data.reduce((a,b)=>a+b.v,0);
  let acc = 0;
  const r = size/2 - thickness/2;
  const cx = size/2, cy = size/2;
  const circumf = 2*Math.PI*r;
  let paths = '';
  data.forEach(d=>{
    const frac = d.v/total;
    const dash = frac*circumf;
    const gap = circumf-dash;
    const rot = (acc/total)*360 - 90;
    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.c}" stroke-width="${thickness}"
      stroke-dasharray="${dash} ${gap}" transform="rotate(${rot} ${cx} ${cy})" stroke-linecap="butt"/>`;
    acc += d.v;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}
    <circle cx="${cx}" cy="${cy}" r="${r-thickness/2-4}" fill="var(--crema)"/>
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="DM Serif Display" font-size="18" fill="#3B1418">${(total/1000000).toLocaleString('es-CO',{maximumFractionDigits:0})}M</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-family="DM Sans" font-size="9" fill="#6b5c4f" letter-spacing="1">COP TOTAL</text>
    </svg>`;
}
function legendHTML(data, total){
  return data.map(d=>`<div class="li"><span class="sw" style="background:${d.c}"></span>${d.n}<span class="lv">${COPM(d.v)} · ${(d.v/total*100).toFixed(1)}%</span></div>`).join('');
}
function barChartHTML(data, maxOverride){
  const max = maxOverride || Math.max(...data.map(d=>d.v));
  return `<div class="bar-chart">${data.map(d=>`
    <div class="bar-row">
      <div>${d.n}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(d.v/max*100).toFixed(1)}%; background:${d.c}"></div></div>
      <div class="bar-val">${COPM(d.v)}</div>
    </div>`).join('')}</div>`;
}

    </div>`).join('');
}

const JOURNEY = ['Descubrim.','Interés','Consider.','Confianza','Registro','Contacto','Asistencia','Matrícula','Fideliz.','Referido'];

 {n:'Fase 1', t:'Preparación', s:'Semanas 1-4', v:17000000, c:'#C98A1E', tc:'#3B1418', d:'Producción de contenidos, accesibilidad y vocería. Sin pauta activa.'},
 {n:'Fase 2', t:'Expectativa', s:'Semanas 5-8', v:13000000, c:'#2E7D5B', tc:'#FBF3E6', d:'RRPP, seeding con aliados y pauta digital de bajo volumen.'},
 {n:'Fase 3', t:'Lanzamiento', s:'Semanas 9-12', v:81000000, c:'#E2231A', tc:'#FBF3E6', d:'Evento en campus + mix 360° completo. El mayor esfuerzo del plan.'},
 {n:'Fase 4', t:'Sostenimiento', s:'Meses 4-6', v:39000000, c:'#3B1418', tc:'#FBF3E6', d:'Remarketing, conversión sostenida y testimonios reales.'},

function renderPresupuesto(){

function renderMasterTable(){
  let html = `<table><tr><th>Medio</th><th>Canal</th><th>Objetivo</th><th>Público</th><th>Fase</th><th>Inversión</th><th>%</th><th>KPI</th><th>Resultado esperado</th></tr>`;
  MASTER_TABLE.forEach(r=>{
    html += `<tr><td><b>${r.medio}</b></td><td>${r.canal}</td><td>${r.objetivo}</td><td>${r.publico}</td><td>${r.fase}</td><td>${COP(r.inv)}</td><td>${(r.inv/BUDGET_TOTAL*100).toFixed(1)}%</td><td>${r.kpi}</td><td>${r.resultado}</td></tr>`;
  });
  html += `<tr style="font-weight:700;"><td colspan="5">TOTAL</td><td>${COP(MASTER_SUM)}</td><td>100.0%</td><td colspan="2"></td></tr>`;

function renderFaseSection(){

function renderMonths(){

    <div class="tmonth">

/* ---- Bootstrap de la app ---- */
const wrap = document.getElementById('slidesWrap');
SECTIONS.forEach((s,i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0?' active':'');
  div.id = 'slide-'+s.id;

renderPersonas();
renderJourney();
renderFases();

renderMasterTable();
renderFaseSection();
renderMonths();
renderPOE();
renderScenarios();

// menu
const menuGrid = document.getElementById('menuGrid');
menuGrid.innerHTML = SECTIONS.map((s,i)=>`<button class="menu-item" data-i="${i}"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="ttl">${s.title}</div></button>`).join('');

// dots
const dotsWrap = document.getElementById('dots');
dotsWrap.innerHTML = SECTIONS.map((s,i)=>`<div class="dot" data-i="${i}" title="${s.title}"></div>`).join('');

let current = 0;
function goTo(i){
  if(i<0) i=0; if(i>=SECTIONS.length) i=SECTIONS.length-1;
  document.querySelectorAll('.slide')[current].classList.remove('active');
  current = i;
  document.querySelectorAll('.slide')[current].classList.add('active');
  document.querySelectorAll('.slide')[current].scrollTop = 0;
  document.getElementById('progressFill').style.width = ((current+1)/SECTIONS.length*100)+'%';
  document.getElementById('progressLabel').textContent = String(current+1).padStart(2,'0')+' / '+SECTIONS.length;
  document.querySelectorAll('.menu-item').forEach(el=>el.classList.toggle('active', +el.dataset.i===current));
  document.querySelectorAll('.dot').forEach(el=>el.classList.toggle('active', +el.dataset.i===current));
  closeMenu();
}
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.querySelectorAll('.menu-item').forEach(el=>el.onclick=()=>goTo(+el.dataset.i));
document.querySelectorAll('.dot').forEach(el=>el.onclick=()=>goTo(+el.dataset.i));

function openMenu(){document.getElementById('menuOverlay').classList.add('open');}
function closeMenu(){document.getElementById('menuOverlay').classList.remove('open');}
document.getElementById('menuBtn').onclick = openMenu;
document.getElementById('menuOverlay').addEventListener('click', e=>{ if(e.target.id==='menuOverlay') closeMenu(); });

document.getElementById('fsBtn').onclick = ()=>{
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else{ document.exitFullscreen(); }
};

window.addEventListener('keydown', e=>{
  if(document.getElementById('menuOverlay').classList.contains('open')){
    if(e.key==='Escape') closeMenu();
    return;
  }
  if(e.key==='ArrowRight' || e.key===' ') { goTo(current+1); e.preventDefault(); }
  if(e.key==='ArrowLeft') { goTo(current-1); e.preventDefault(); }
  if(e.key==='Escape') closeMenu();
});

goTo(0);
</script>
